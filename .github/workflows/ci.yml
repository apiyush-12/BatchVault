name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# No secrets are referenced by this workflow. The database job runs against a
# disposable local Supabase stack, never a real project (testing.md §2.3).
permissions:
  contents: read

env:
  # A sentinel, not a credential: the artifact check looks for this exact
  # value in the client bundle, so a leak fails the build loudly
  # (security.md §12).
  SUPABASE_SERVICE_ROLE_KEY: ci-sentinel-service-role-value-not-a-real-key

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Reproducible from the committed lockfile (security.md §30).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build

      - name: Client artifact checks
        run: pnpm test:artifacts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  database:
    name: Database, RLS and B2 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Disposable stack: every migration and policy is actually applied, and
      # the B2 experiment runs against the real Supabase role model.
      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Apply migrations
        run: pnpm exec supabase db reset --no-seed

      - name: Export stack credentials
        # Exported under the names the application already documents
        # (architecture §15), so the tests never need a second convention.
        run: |
          echo "DATABASE_URL=$(pnpm exec supabase status -o env | grep '^DB_URL=' | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(pnpm exec supabase status -o env | grep '^API_URL=' | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d'=' -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Foundation migration, Storage privacy and B2 tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
